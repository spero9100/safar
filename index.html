state=structuredClone(blank)};if(!state.trip || state.trip.destination==='Your destination' || !state.itinerary?.some(x=>String(x.id).startsWith('seed-it-'))){const old=state;state=structuredClone(blank);for(const k of ['expenses','itinerary','bookings','documents','details']){const existing=Array.isArray(old[k])?old[k]:[];state[k]=[...state[k],...existing.filter(x=>!state[k].some(y=>y.id===x.id))]}if(old.trip&&old.trip.destination!=='Your destination'){state.trip.budget=old.trip.budget||state.trip.budget;state.trip.sgdRate=old.trip.sgdRate||72}}state.documents.forEach(d=>{if(String(d.url||'').startsWith('docs/'))d.url=''});state.trip.sgdRate=Number(state.trip.sgdRate)||72;state.trip.currency='INR';state.expenses.forEach(e=>{if(!e.currency)e.currency='INR'});let tab='Dashboard',mode='',selectedDay=today();const $=id=>document.getElementById(id),save=()=>localStorage.setItem(K,JSON.stringify(state)),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),fmt=n=>new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR',maximumFractionDigits:0}).format(Number(n)||0),date=s=>s?new Date(s+'T12:00:00').toLocaleDateString('en-IN',{day:'numeric',month:'short',weekday:'short'}):'—',inr=e=>Number(e.amount||0)*(e.currency==='SGD'?(Number(e.rate)||Number(state.trip.sgdRate)||72):1),sum=()=>state.expenses.reduce((a,e)=>a+inr(e),0),expenseLabel=e=>`${e.currency==='SGD'?'S$':'₹'}${Number(e.amount||0).toLocaleString('en-IN',{maximumFractionDigits:2})}${e.currency==='SGD'?' · '+fmt(inr(e)):''}`;const tabs=['Dashboard','Itinerary','Expenses','Bookings','Documents','Details'];function render(){ $('tripTitle').textContent=state.trip.name;$('tripMeta').textContent=`${state.trip.destination}  ·  ${date(state.trip.start)} – ${date(state.trip.end)}`;$('nav').innerHTML=tabs.map(t=>`<button class="${tab===t?'active':''}" onclick="tab='${t}';render()"><span class="navicon">${({Dashboard:'⌂',Itinerary:'▦',Expenses:'◉',Bookings:'✈',Documents:'▤',Details:'☷'})[t]}</span>${t}</button>`).join('');$('content').innerHTML=({Dashboard:dashboard,Itinerary:itinerary,Expenses:expenses,Bookings:bookings,Documents:documents,Details:details})[tab]()}function upcoming(){return state.itinerary.filter(x=>x.date>=today()).sort((a,b)=>(a.date+' '+a.time).localeCompare(b.date+' '+b.time))}function shortTitle(x){return x.title.replace(/ · .*/, '').replace('Private ','').replace('Singapore ','').replace('Transfers from ','').replace(' → ',' → ')}
function timeLabel(x){return x.time?x.time.slice(0,5):'TBC'}
function selectDay(d){selectedDay=d;render();document.getElementById('dayOverview')?.scrollIntoView({behavior:'smooth',block:'nearest'})}
function dashboard(){let up=upcoming(),next=up[0],spent=sum(),budget=Number(state.trip.budget)||0,days=Math.max(1,Math.round((new Date(state.trip.end)-new Date(state.trip.start))/86400000)+1),day=Math.floor((new Date(today())-new Date(state.trip.start))/86400000)+1,now=new Date(),hour=now.getHours(),greeting=hour<12?'Good morning':hour<17?'Good afternoon':'Good evening';let selected=state.itinerary.filter(x=>x.date===selectedDay).sort((a,b)=>(a.time||'99').localeCompare(b.time||'99'));return `<div class="welcome"><div class="eyebrow">YOUR SINGAPORE TRAVEL JOURNAL</div><h2>${greeting}<span class="sunmark"> ✳</span></h2><div class="muted">Tap any date to see its plans at a glance.</div></div><div class="daystrip">${Array.from({length:Math.min(days,14)},(_,i)=>{let d=new Date(state.trip.start+'T12:00:00');d.setDate(d.getDate()+i);let iso=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');let events=state.itinerary.filter(x=>x.date===iso).sort((a,b)=>(a.time||'99').localeCompare(b.time||'99'));return `<button class="daychip ${iso===today()?'current':''} ${iso===selectedDay?'selected':''}" onclick="selectDay('${iso}')"><span>${d.toLocaleDateString('en-US',{weekday:'short'})} · ${d.toLocaleDateString('en-US',{month:'short'})}</span><strong>${d.getDate()}</strong><div class="day-events">${events.slice(0,3).map(x=>`<div class="day-event"><b>${timeLabel(x)}</b> ${esc(shortTitle(x))}</div>`).join('')}${events.length>3?`<div class="day-event">+${events.length-3} more</div>`:''}</div></button>`}).join('')}</div><div class="date-today-summary" id="dayOverview"><strong>${date(selectedDay)} · ${selected.length} plans</strong>${selected.map(x=>`<div>${esc(timeLabel(x))} — ${esc(x.title)}</div>`).join('')||'<div>No activities scheduled</div>'}<button class="secondary" style="margin-top:10px" onclick="tab='Itinerary';render()">See photo itinerary →</button></div><div class="grid"><div class="card"><div class="stat-icon">🌿</div><div class="statlabel">Your journey</div><div class="big">${day<1?'Coming soon':day>days?'Complete':`Day ${day} / ${days}`}</div></div><div class="card"><div class="stat-icon">🧾</div><div class="statlabel">Total trip expenses · INR</div><div class="big">${fmt(spent)}</div><div class="mini-pill">${state.expenses.length} entries</div></div><div class="card"><div class="stat-icon">🍃</div><div class="statlabel">Remaining budget</div><div class="big">${fmt(budget-spent)}</div></div></div><div class="card" style="background:#e9efe5"><div class="eyebrow">✦ UP NEXT</div>${next?`<h3 style="font-size:24px;margin:12px 0 8px">${esc(next.title)}</h3><div class="muted">${date(next.date)} · ${esc(next.time||'Time to confirm')} · ${esc(next.location||'')}</div>`:'<h3>Journey complete</h3>'}</div><div class="card"><h3>Recent spending</h3>${list([...state.expenses].reverse().slice(0,4),x=>esc(x.title),x=>`${expenseLabel(x)} · ${esc(x.category)}`)}<button class="secondary" onclick="openExpense()">＋ Quick expense</button></div>`}
function list(arr,title,sub,kind){return arr.length?arr.map(x=>`<div class="item"><div><strong>${title(x)}</strong><small>${esc(sub(x)||'')}</small></div>${kind?`<button class="secondary danger" onclick="remove('${kind}','${x.id}')">Delete</button>`:''}</div>`).join(''):'<div class="empty">Nothing added yet</div>'}function head(title,action){return `<div class="sectionhead"><h2>${title}</h2><button class="primary" onclick="openForm('${action}')">＋ Add</button></div>`}const photos=[['flight','https://images.unsplash.com/photo-1436491865332-7a61a109cc05?w=900&q=75'],['airport','https://images.unsplash.com/photo-1436491865332-7a61a109cc05?w=900&q=75'],['hotel','https://images.unsplash.com/photo-1571896349842-33c89424de2d?w=900&q=75'],['ice cream','https://images.unsplash.com/photo-1563805042-7684c019e1cb?w=900&q=75'],['mandai','https://images.unsplash.com/photo-1549366021-9f761d450615?w=900&q=75'],['universal','https://images.unsplash.com/photo-1470229722913-7c0e2dbbafd3?w=900&q=75'],['oceanarium','https://images.unsplash.com/photo-1544551763-46a013bb70d5?w=900&q=75'],['skypark','https://images.unsplash.com/photo-1525625293386-3f8f99389edd?w=900&q=75'],['marina','https://images.unsplash.com/photo-1525625293386-3f8f99389edd?w=900&q=75'],['gardens','https://images.unsplash.com/photo-1525625293386-3f8f99389edd?w=900&q=75'],['city tour','https://images.unsplash.com/photo-1496939376851-89342e90adcd?w=900&q=75']];function photoFor(x){let t=(x.title+' '+x.location).toLowerCase();let found=photos.find(([k])=>t.includes(k));return found?found[1]:'https://images.unsplash.com/photo-1488646953014-85cb44e25828?w=900&q=75'}
function itinerary(){let all=[...state.itinerary].sort((a,b)=>(a.date+' '+(a.time||'99')).localeCompare(b.date+' '+(b.time||'99'))),dates=[...new Set(all.map(x=>x.date))];return head('Your photo itinerary','itinerary')+`<p class="muted" style="font-size:13px">All timings are local to the activity location. TBC means the time wasn't supplied in your vouchers. Photos are illustrative.</p>`+dates.map(d=>`<h3 class="day-heading">${date(d)}<small>${all.filter(x=>x.date===d).length} activities and travel plans</small></h3><div class="photo-itinerary">${all.filter(x=>x.date===d).map(x=>{let booking=state.bookings.find(b=>b.title===x.title||b.date===x.date&&b.title.toLowerCase().includes(x.title.split(' · ')[0].toLowerCase()));return `<article class="photo-card"><img loading="lazy" src="${photoFor(x)}" alt="Travel illustration for ${esc(x.title)}"><div class="photo-content"><span class="timebadge">${esc(x.time||'Time to confirm')}</span><h3>${esc(x.title)}</h3><p>📍 ${esc(x.location||'Singapore')}</p><p>${esc(x.notes||'')}</p>${booking?.reference?`<div class="ref">Booking ref: ${esc(booking.reference)} <button class="secondary" onclick="copyRef('${esc(booking.reference)}')">Copy</button></div>`:''}<button class="secondary danger" style="margin-top:10px" onclick="remove('itinerary','${x.id}')">Remove</button></div></article>`}).join('')}</div>`).join('')}
function copyRef(s){navigator.clipboard?.writeText(s).then(()=>alert('Reference copied')).catch(()=>prompt('Copy reference:',s))}
function expenses(){let cats={};state.expenses.forEach(x=>cats[x.category]=(cats[x.category]||0)+inr(x));return `<div class="grid"><div class="card"><div class="muted">Total spent</div><div class="big">${fmt(sum())}</div></div><div class="card"><div class="muted">Remaining budget</div><div class="big">${fmt(Number(state.trip.budget)-sum())}</div></div><div class="card"><div class="muted">Entries</div><div class="big">${state.expenses.length}</div></div></div><div class="card"><h3>Exchange rate</h3><div class="muted">1 SGD = ₹${Number(state.trip.sgdRate).toFixed(2)} · Change in Edit trip. Each SGD expense saves its rate when entered.</div></div><div class="card"><h3>By category</h3>${Object.entries(cats).map(([k,v])=>`<div class="item"><span>${esc(k)}</span><strong>${fmt(v)}</strong></div>`).join('')||'<div class="empty">No expenses yet</div>'}</div>${head('All expenses','expenses')}<div class="card">${list([...state.expenses].reverse(),x=>`${esc(x.title)} <span class="muted">· ${expenseLabel(x)}</span>`,x=>`${date(x.date)} · ${x.category} · ${x.payment||'Cash'} · ${x.person||'Shared'}`,'expenses')}</div><button class="secondary" onclick="exportExpenses()">↓ Export expenses (CSV)</button>`}function bookings(){return head('Travel & stays','bookings')+`<div class="card">${list(state.bookings,x=>`${esc(x.type)} · ${esc(x.title)}`,x=>`${date(x.date)} ${x.time||''} · ${x.reference||''} · ${x.notes||''}`,'bookings')}</div>`}// Private files live in IndexedDB on this device; no PDFs need to be published on Netlify.
const DB_NAME='safar_private_docs_v1';function docDB(){return new Promise((resolve,reject)=>{const r=indexedDB.open(DB_NAME,1);r.onupgradeneeded=()=>r.result.createObjectStore('files');r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
async function storeDoc(id,file){const db=await docDB();await new Promise((resolve,reject)=>{const tx=db.transaction('files','readwrite');tx.objectStore('files').put(file,id);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)});db.close()}
async function getDoc(id){const db=await docDB();let result=await new Promise((resolve,reject)=>{const tx=db.transaction('files','readonly');const req=tx.objectStore('files').get(id);req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)});db.close();return result}
async function attachDoc(id,input){const file=input.files?.[0];if(!file)return;if(file.type!=='application/pdf'){alert('Please choose a PDF');return}try{await storeDoc(id,file);alert('PDF saved privately on this device.');render()}catch(e){alert('Could not save PDF: '+e.message)}}
async function viewDoc(id){try{const file=await getDoc(id);if(!file){alert('No PDF attached on this device yet. Tap Attach PDF.');return}const url=URL.createObjectURL(file);const a=document.createElement('a');a.href=url;a.target='_blank';a.rel='noopener';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000)}catch(e){alert('Unable to open PDF: '+e.message)}}
function documents(){return head('Your private travel wallet','documents')+`<div class="card"><div class="privacy-note"><strong>Private on your phone.</strong> Upload your ticket, voucher and insurance PDFs here after opening your Netlify site. They are saved in your phone's browser, not published on Netlify. Attach once on each device. Clearing browser data may remove them; keep original copies elsewhere.</div>${state.documents.map(x=>`<div class="doc-row"><strong>📄 ${esc(x.title)}</strong><div class="muted" style="font-size:12px;margin-top:5px">${esc(x.notes||'')}</div><div class="doc-actions"><button class="secondary" onclick="viewDoc('${x.id}')">↗ Open PDF</button><label class="secondary" style="display:inline-flex;align-items:center;cursor:pointer;margin:0">＋ Attach / replace PDF<input type="file" accept="application/pdf,.pdf" style="display:none" onchange="attachDoc('${x.id}',this)"></label>${x.url?`<a href="${esc(x.url)}" target="_blank">External link</a>`:''}</div></div>`).join('')}</div><div class="card"><h3>How this works on Netlify</h3><p class="hint">Deploy this app without any personal PDFs in the site folder. On your phone, open Documents and attach the four PDFs. Your itinerary and booking numbers are included in the website code, so keep the site private too. Browser storage does not sync between phones.</p></div>`}
function details(){return head('Important details','details')+`<div class="card">${list(state.details,x=>esc(x.title),x=>x.value,'details')}</div>`}const fields={trip:[['name','Trip name','text'],['destination','Destination','text'],['start','Start date','date'],['end','End date','date'],['sgdRate','SGD to INR rate (₹ for 1 SGD)','number'],['budget','Total budget','number']],expenses:[['title','Expense (e.g. Taxi to hotel)','text'],['amount','Amount','number'],['currency','Currency','select','SGD|INR'],['date','Date','date'],['category','Category','select','Food|Transport|Hotel|Shopping|Activities|Tickets|Other'],['payment','Payment method','select','Cash|Card|UPI|Other'],['person','For whom?','select','Shared|Me|Mother']],itinerary:[['title','Activity','text'],['date','Date','date'],['time','Time','time'],['location','Location','text'],['notes','Notes','textarea']],bookings:[['type','Booking type','select','Flight|Train|Hotel|Cab|Activity|Other'],['title','Booking name','text'],['date','Date','date'],['time','Time','time'],['reference','Confirmation / PNR','text'],['notes','Notes','textarea']],documents:[['title','Document title','text'],['url','Secure document URL','url'],['notes','Notes','textarea']],details:[['title','Detail title','text'],['value','Information','textarea']]};function openForm(m){mode=m;$('modalTitle').textContent=m==='trip'?'Trip setup':`Add ${m.slice(0,-1)}`;$('fields').innerHTML=fields[m].map(([key,label,type,options])=>`<label for="f_${key}">${label}</label>${type==='select'?`<select id="f_${key}" name="${key}">${options.split('|').map(o=>`<option>${o}</option>`).join('')}</select>`:type==='textarea'?`<textarea id="f_${key}" name="${key}"></textarea>`:`<input id="f_${key}" name="${key}" type="${type}" ${['title','name','amount'].includes(key)?'required':''} ${type==='number'?'min="0" step="0.01"':''}>`}`).join('');if(m==='trip')Object.entries(state.trip).forEach(([k,v])=>{let el=$('f_'+k);if(el)el.value=v});else{let d=$('f_date');if(d)d.value=today()}$('modal').showModal()}function editTrip(){openForm('trip')}function openExpense(){openForm('expenses')} $('editor').onsubmit=e=>{e.preventDefault();let obj=Object.fromEntries(new FormData(e.target));if(mode==='trip')state.trip=obj;else {if(mode==='expenses'&&obj.currency==='SGD')obj.rate=Number(state.trip.sgdRate)||72;state[mode].push({...obj,id:crypto.randomUUID()})};save();$('modal').close();render()};function remove(type,id){if(confirm('Delete this entry?')){state[type]=state[type].filter(x=>x.id!==id);save();render()}}function exportExpenses(){const keys=['date','title','category','amount','currency','rate','amount_inr','payment','person'];const csv=[keys.join(','),...state.expenses.map(e=>keys.map(k=>'"'+String(k==='amount_inr'?inr(e):(e[k]??'')).replaceAll('"','""')+'"').join(','))].join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='safar-expenses.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}render();
